/* =========================================================
   0. 유틸
========================================================= */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayStr = () => ymd(new Date());
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const startOfWeek = s => { const d = parseYmd(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); }; // 월요일 시작
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmtMD = s => { const d = parseYmd(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`; };
const fmtRel = (s, today = todayStr()) => {
  const diff = Math.round((parseYmd(s) - parseYmd(today)) / 86400000);
  if (diff === 0) return '오늘'; if (diff === 1) return '내일'; if (diff === 2) return '모레'; if (diff === -1) return '어제';
  if (diff < 0) return `${-diff}일 지남`;
  return fmtMD(s);
};
const fmtDur = sec => {
  const m = Math.floor(sec / 60);

const onEnter = fn => e => { if (e.key === 'Enter' && !e.nativeEvent.isComposing) { e.preventDefault(); fn(); } };

/* =========================================================

const ICON_CAND = { House: ['House', 'Home'], Loader: ['LoaderCircle', 'Loader2', 'Loader'], Alert: ['CircleAlert', 'AlertCircle', 'TriangleAlert', 'Info'], Brain: ['Brain', 'BrainCircuit', 'Lightbulb'] };
function Icon({ name, size = 18, className = '', strokeWidth = 2 }) {
  const lib = window.lucide && window.lucide.icons;
  let node = lib && lib[name];
  if (!node && lib && ICON_CAND[name]) node = ICON_CAND[name].map(n => lib[n]).find(Boolean);
  if (!node) return <span className={'inline-block ' + className} style={{ width: size, height: size }} />;
  const children = (node[0] === 'svg' && Array.isArray(node[2])) ? node[2] : node;
  const camel = k => k.replace(/-([a-z])/g, (m, c) => c.toUpperCase());
  return (
    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
      {children.map((c, i) => {
        const attrs = {}; Object.keys(c[1] || {}).forEach(k => { if (k !== 'key') attrs[camel(k)] = c[1][k]; });
        return React.createElement(c[0], { ...attrs, key: i });
      })}
    </svg>
  );
}

/* =========================================================
   2. 데이터 모델 / 샘플 / 저장
========================================================= */
const STORE_KEY = 'jitmaja:data:v1', SET_KEY = 'jitmaja:settings:v1';
const DEFAULT_SETTINGS = {
  theme: 'system', focusMin: 25, breakMin: 5,
  aiProvider: 'gemini', geminiKey: '', geminiModel: 'gemini-2.5-flash', openaiKey: '', openaiModel: 'gpt-4o-mini',
  notionToken: '', notionDb: '', proxyUrl: '',
};
const blankTask = () => ({
  id: uid(), title: '', done: false, doneAt: null, due: todayStr(), time: '', priority: 'mid', tags: [],
  notes: '', subtasks: [], focusSec: 0, pomodoros: 0, pinnedDate: null, pinnedAt: 0, order: 0,
  createdAt: new Date().toISOString(), notionId: null, notionEdited: null, notionDirty: true, contentDirty: true,
});
function normalizeData(d) {
  return {
    tasks: (d.tasks || []).map((t, i) => ({ ...blankTask(), order: i, ...t, tags: Array.isArray(t.tags) ? t.tags : [], subtasks: Array.isArray(t.subtasks) ? t.subtasks : [] })),
    memos: Array.isArray(d.memos) ? d.memos : [],
    focusByDate: d.focusByDate || {},
    briefing: d.briefing || null,
    pendingDeletes: Array.isArray(d.pendingDeletes) ? d.pendingDeletes : [],
  };
}
function makeSeed() {
  const t = todayStr(), y = addDays(t, -1), y2 = addDays(t, -2), y3 = addDays(t, -3);
  const sub = (text, done = false) => ({ id: uid(), text, done });
  const mk = (o, i) => ({ ...blankTask(), order: i, ...o });
  const tasks = [
    mk({ title: '전공(알고리즘) 중간고사 대비 3~5장 정리', due: t, time: '19:00', priority: 'high', tags: ['학업'], pinnedDate: t, pinnedAt: 1,
      notes: '## 시험 범위\n- **3장** 분할 정복 / 정렬\n- **4장** 그리디\n- **5장** 동적 계획법 (배낭 문제)\n\n> 기출 문제는 마지막에 시간 재고 풀어보기!\n\n### 체크포인트\n- [ ] 점화식 직접 세우기\n- [x] 교수님 공지 확인',
      subtasks: [sub('3장 핵심 개념 요약 노트 만들기 (40분)', true), sub('4장 그리디 예제 3개 풀기 (50분)'), sub('5장 DP 점화식 정리 (60분)'), sub('기출문제 1회분 풀이 (60분)')], focusSec: 3000, pomodoros: 2 }, 0),
    mk({ title: "프로젝트 '잊지 마!' 로그인 API 구현", due: t, time: '', priority: 'high', tags: ['프로젝트'], pinnedDate: t, pinnedAt: 2,
      notes: '## 오늘 목표\n`POST /auth/login` 엔드포인트 완성\n\n- JWT 발급 및 만료 시간 설정\n- 비밀번호 해시 검증\n- 에러 응답 형식 통일\n\n[API 문서 참고](https://developer.mozilla.org/)',
      subtasks: [sub('요청/응답 스키마 정의하기 (30분)'), sub('로그인 핸들러 구현하기 (60분)'), sub('단위 테스트 작성하기 (45분)')] }, 1),
    mk({ title: '영어 스터디 단어 50개 암기', due: t, time: '21:00', priority: 'mid', tags: ['학업'] }, 2),
    mk({ title: '수강신청 장바구니 확인', due: t, priority: 'low', tags: ['학업'], done: true, doneAt: new Date().toISOString() }, 3),
    mk({ title: '치과 예약 확인 전화하기', due: y, time: '14:00', priority: 'low', tags: ['일상'], notes: '평일 오전 진료만 가능한지 물어보기' }, 4),
    mk({ title: '동아리 정기 모임 발표 자료 만들기', due: addDays(t, 1), time: '18:00', priority: 'mid', tags: ['동아리'], notes: '- 주제: 신입 부원 온보딩 개선안\n- 슬라이드 10장 이내' }, 5),
    mk({ title: '장보기 및 주간 식단 정리', due: addDays(t, 2), priority: 'low', tags: ['일상'] }, 6),
    mk({ title: '아침 러닝 30분', due: y, priority: 'low', tags: ['일상'], done: true, doneAt: new Date().toISOString() }, 7),
    mk({ title: '교양 레포트 제출', due: y2, priority: 'mid', tags: ['학업'], done: true, doneAt: new Date().toISOString() }, 8),
    mk({ title: '동아리 회의록 정리', due: y3, priority: 'low', tags: ['동아리'], done: true, doneAt: new Date().toISOString() }, 9),
  ];

    focusByDate: { [t]: 1500, [y]: 3000, [y2]: 1800 },
    briefing: null, pendingDeletes: [],
  };
}
function loadData() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.tasks)) return normalizeData(d); } } catch (e) {}
  return makeSeed();
}
function loadSettings() {
  try { return { ...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem(SET_KEY) || '{}') }; } catch (e) { return { ...DEFAULT_SETTINGS }; }
}

/* =========================================================
   3. 자연어 파서  "내일 오후 3시 전공 시험 공부 #학업 !높음"
========================================================= */
const WD = { 월: 0, 화: 1, 수: 2, 목: 3, 금: 4, 토: 5, 일: 6 };
function parseQuick(input, base = todayStr()) {
  let s = ' ' + input + ' ';
  const out = { title: '', due: null, time: '', priority: null, tags: [] };
  const take = re => { const m = s.match(re); if (m) s = s.replace(m[0], ' '); return m; };

  s = s.replace(/(^|\s)#([^\s#!]+)/g, (m, a, t) => { out.tags.push(t); return a + ' '; });
  s = s.replace(/(^|\s)!(높음|높게|중요|긴급|상|high|h|중간|보통|중|mid|medium|m|낮음|낮게|하|low|l)(?=\s)/gi, (m, a, p) => {
    p = p.toLowerCase();
    out.priority = /^(높|중요|긴급|상|high|h)/.test(p) ? 'high' : /^(낮|하|low|l)/.test(p) ? 'low' : 'mid';
    return a + ' ';
  });
  // 시간
  s = s.replace(/(오전|오후|아침|새벽|저녁|밤|낮)?\s*(\d{1,2})\s*시(?!간)\s*(?:(\d{1,2})\s*분|(반))?/, (m, ap, h, mi, half) => {
    let H = +h, M = half ? 30 : (mi ? +mi : 0);
    if (H > 24 || M > 59) return m;
    if (ap && /오후|저녁|밤/.test(ap) && H < 12) H += 12;
    if (ap && /오전|아침|새벽/.test(ap) && H === 12) H = 0;
    if (ap === '낮' && H < 11) H += 12;
    out.time = `${pad(H % 24)}:${pad(M)}`; return ' ';
  });
  if (!out.time) s = s.replace(/(^|\s)(\d{1,2}):(\d{2})(?=\s)/, (m, a, h, mi) => {
    if (+h < 24 && +mi < 60) { out.time = `${pad(+h)}:${mi}`; return a + ' '; } return m;
  });
  // 날짜
  const bd = parseYmd(base);
  const md = (mo, da) => { let d = new Date(bd.getFullYear(), mo - 1, da); if (ymd(d) < base) d = new Date(bd.getFullYear() + 1, mo - 1, da); return ymd(d); };
  let m;
  if ((m = take(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})/))) out.due = `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  else if ((m = take(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/))) out.due = md(+m[1], +m[2]);
  else if ((m = take(/(^|\s)(\d{1,2})\/(\d{1,2})(?=\s)/))) out.due = md(+m[2], +m[3]);
  else if ((m = take(/(\d{1,3})\s*(일|주|개월)\s*(?:후|뒤)/))) {
    if (m[2] === '개월') { const d = parseYmd(base); d.setMonth(d.getMonth() + +m[1]); out.due = ymd(d); }
    else out.due = addDays(base, +m[1] * (m[2] === '주' ? 7 : 1));
  }
  else if ((m = take(/(다다음|다음|이번)\s*주\s*([월화수목금토일])\s*요일/))) out.due = addDays(startOfWeek(base), (m[1] === '이번' ? 0 : m[1] === '다음' ? 1 : 2) * 7 + WD[m[2]]);
  else if ((m = take(/(이번|다음)?\s*주말/))) { let d = addDays(startOfWeek(base), 5 + (m[1] === '다음' ? 7 : 0)); if (d < base) d = base; out.due = d; }
  else if ((m = take(/(다다음|다음)\s*주/))) out.due = addDays(base, m[1] === '다음' ? 7 : 14);
  else if ((m = take(/이번\s*주/))) out.due = base;
  else if ((m = take(/([월화수목금토일])\s*요일/))) { const cur = (bd.getDay() + 6) % 7; out.due = addDays(base, (WD[m[1]] - cur + 7) % 7); }
  else if ((m = take(/(내일모레|모레|글피|오늘|내일)/))) out.due = addDays(base, { 오늘: 0, 내일: 1, 모레: 2, 내일모레: 2, 글피: 3 }[m[1]]);

  out.title = s.replace(/\s+/g, ' ').trim();
  return out;
}

/* =========================================================
   4. 마크다운 (안전한 미니 렌더러)
========================================================= */
const escapeHtml = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function inlineMd(s) {
  s = escapeHtml(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s;
}
function mdToHtml(src) {
  const lines = (src || '').replace(/\r/g, '').split('\n');
  let html = '', list = null, inCode = false, code = [];
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const line of lines) {
    if (line.trim().startsWith('```')) {
      if (inCode) { html += `<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`; code = []; inCode = false; }
      else { closeList(); inCode = true; }
      continue;
    }
    if (inCode) { code.push(line); continue; }
    let m;
    if ((m = line.match(/^(#{1,3})\s+(.*)/))) { closeList(); html += `<h${m[1].length}>${inlineMd(m[2])}</h${m[1].length}>`; }
    else if (/^\s*([-*_])\1{2,}\s*$/.test(line)) { closeList(); html += '<hr/>'; }
    else if ((m = line.match(/^\s*[-*]\s+$$( |x|X)$$\s+(.*)/))) {
      if (list !== 'ul') { closeList(); html += '<ul>'; list = 'ul'; }
      html += `<li class="md-task"><input type="checkbox" disabled ${m[1] !== ' ' ? 'checked' : ''}/> ${inlineMd(m[2])}</li>`;
    }
    else if ((m = line.match(/^\s*[-*]\s+(.*)/))) { if (list !== 'ul') { closeList(); html += '<ul>'; list = 'ul'; } html += `<li>${inlineMd(m[1])}</li>`; }
    else if ((m = line.match(/^\s*\d+\.\s+(.*)/))) { if (list !== 'ol') { closeList(); html += '<ol>'; list = 'ol'; } html += `<li>${inlineMd(m[1])}</li>`; }
    else if ((m = line.match(/^>\s?(.*)/))) { closeList(); html += `<blockquote>${inlineMd(m[1])}</blockquote>`; }
    else if (!line.trim()) closeList();
    else { closeList(); html += `<p>${inlineMd(line)}</p>`; }
  }
  if (inCode) html += `<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`;
  closeList();
  return html;
}

/* =========================================================
   5. AI (Gemini / OpenAI) – 브라우저에서 직접 호출
========================================================= */
const AI_SYS = '당신은 한국어로 답하는 친절한 생산성 코치입니다. 반드시 유효한 JSON 객체만 출력하세요. 설명이나 코드블록 표시는 금지입니다.';
const aiReadyOf = s => s.aiProvider === 'openai' ? !!s.openaiKey : !!s.geminiKey;
function parseJsonLoose(text) {

function TaskList({ ctx }) {

function rankTasks(list, today) {
  return [...list].sort((a, b) =>
    ((a.pinnedDate === today ? 0 : 1) - (b.pinnedDate === today ? 0 : 1)) || (PRI[a.priority].rank - PRI[b.priority].rank) ||
    a.due.localeCompare(b.due) || (a.time || '99').localeCompare(b.time || '99') || a.order - b.order);
}
function localBriefing(tasks, today) {
  const open = tasks.filter(t => !t.done && t.due <= today);
  const reason = t => t.due < today ? '기한이 이미 지났어요' : t.pinnedDate === today ? '오늘의 핵심 할 일' : t.priority === 'high' ? '우선순위가 높아요' : t.time ? `${t.time}까지` : '오늘 마감';
  const message = open.length === 0 ? '오늘 할 일을 모두 끝냈어요. 정말 멋져요! 🎉' : open.length <= 3 ? '조금만 더 하면 오늘 끝! 하나씩 차근차근 가봐요 💪' : '한 번에 하나씩, 가장 중요한 것부터! 시작이 반이에요 🚀';
  return { order: rankTasks(open, today).slice(0, 5).map(t => ({ title: t.title, reason: reason(t) })), message };
}

    tasks.forEach(t => { const k = primaryTag(t); const g = groups[k] = groups[k] || { tag: k, total: 0, done: 0 }; g.total++; if (t.done) g.done++; });
    const ws = startOfWeek(today);
    const week = Array.from({ length: 7 }, (_, i) => {
      const day = addDays(ws, i), ts = tasks.filter(t => t.due === day), dn = ts.filter(t => t.done).length;

    });

      total: scope.length, doneN, rate: scope.length ? Math.round(doneN / scope.length * 100) : 0, remain: scope.length - doneN,

function CalendarView({ ctx }) {

function App() {
  const [data, setData] = useState(loadData);
  const dataRef = useRef(data);
  const update = useCallback(fn => { const nd = fn(dataRef.current); dataRef.current = nd; setData(nd); }, []);
  const [settings, setSettings] = useState(loadSettings);
  const [view, setViewRaw] = useState('home');
  const [today, setToday] = useState(todayStr());
  const [selectedId, setSelectedId] = useState(null);
  const [modal, setModal] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [aiBusy, setAiBusy] = useState({});
  const [syncing, setSyncing] = useState('');
  const [sysDark, setSysDark] = useState(() => window.matchMedia('(prefers-color-scheme: dark)').matches);
  const headerRef = useRef(null);

  const isDark = settings.theme === 'dark' || (settings.theme === 'system' && sysDark);
  const aiReady = aiReadyOf(settings);
  const notionConfigured = !!(settings.notionToken && settings.notionDb);

  /* ---- 저장 / 테마 / 날짜 ---- */
  useEffect(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) { console.warn('저장 실패', e); } }, [data]);
  useEffect(() => { try { localStorage.setItem(SET_KEY, JSON.stringify(settings)); } catch (e) {} }, [settings]);
  useEffect(() => {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const h = e => setSysDark(e.matches);
    mq.addEventListener ? mq.addEventListener('change', h) : mq.addListener(h);
    return () => { mq.removeEventListener ? mq.removeEventListener('change', h) : mq.removeListener(h); };
  }, []);
  useEffect(() => { document.documentElement.classList.toggle('dark', isDark); }, [isDark]);
  useEffect(() => { const id = setInterval(() => { const n = todayStr(); setToday(p => p === n ? p : n); }, 30000); return () => clearInterval(id); }, []);
  useLayoutEffect(() => {
    const el = headerRef.current; if (!el) return;
    const set = () => document.documentElement.style.setProperty('--hh', el.offsetHeight + 'px');
    set(); const ro = new ResizeObserver(set); ro.observe(el); return () => ro.disconnect();
  }, []);

  /* ---- 토스트 ---- */
  const toast = useCallback((msg, kind = 'info') => {
    const id = uid();
    setToasts(t => [...t.slice(-3), { id, msg, kind }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3500);
  }, []);

  /* ---- 포모도로 ---- */
  const pomo = usePomodoro(
    settings,
    (taskId, sec) => update(d => { const k = todayStr(); return { ...d, tasks: d.tasks.map(t => t.id === taskId ? { ...t, focusSec: (t.focusSec || 0) + sec } : t), focusByDate: { ...d.focusByDate, [k]: (d.focusByDate[k] || 0) + sec } }; }),
    taskId => update(d => ({ ...d, tasks: d.tasks.map(t => t.id === taskId ? { ...t, pomodoros: (t.pomodoros || 0) + 1 } : t) }))
  );
  useEffect(() => {
    const c = pomo.cur;
    document.title = c.running ? `${pad(Math.floor(c.remaining / 60))}:${pad(c.remaining % 60)} · 잊지 마!` : '잊지 마!';
  });

  /* ---- 할 일 CRUD ---- */
  const nextOrder = d => Math.max(-1, ...d.tasks.map(x => x.order)) + 1;
  const addParsed = (text, day) => {
    const p = parseQuick(text, today);
    if (!p.title) { toast('할 일 제목을 입력해 주세요', 'err'); return false; }
    const t = { ...blankTask(), title: p.title, due: p.due || day || today, time: p.time, priority: p.priority || 'mid', tags: p.tags, order: nextOrder(dataRef.current) };
    update(d => ({ ...d, tasks: [...d.tasks, t] }));
    toast(`"${t.title}" 추가 · ${fmtRel(t.due, today)}${t.time ? ' ' + t.time : ''}`, 'ok');
    return true;
  };
  const updateTask = (id, patch) => update(d => ({
    ...d, tasks: d.tasks.map(t => t.id !== id ? t : {
      ...t, ...patch, notionDirty: true,
      contentDirty: t.contentDirty || 'notes' in patch || 'subtasks' in patch,
      doneAt: 'done' in patch ? (patch.done ? new Date().toISOString() : null) : t.doneAt,
    }),
  }));
  const toggleDone = id => {
    const t = dataRef.current.tasks.find(x => x.id === id); if (!t) return;
    updateTask(id, { done: !t.done });
    if (!t.done) toast('완료! 수고했어요 🎉', 'ok');
  };
  const togglePin = id => {
    const d = dataRef.current, t = d.tasks.find(x => x.id === id); if (!t) return;
    if (t.pinnedDate === today) { update(d => ({ ...d, tasks: d.tasks.map(x => x.id === id ? { ...x, pinnedDate: null } : x) })); return; }
    if (d.tasks.filter(x => x.pinnedDate === today).length >= 3) { toast('오늘의 핵심은 최대 3개까지예요. 하나를 해제해 주세요', 'err'); return; }
    update(d => ({ ...d, tasks: d.tasks.map(x => x.id === id ? { ...x, pinnedDate: today, pinnedAt: Date.now() } : x) }));
  };
  const deleteTask = id => {
    if (pomo.cur.taskId === id && pomo.cur.running) pomo.pause();
    const t = dataRef.current.tasks.find(x => x.id === id);
    update(d => ({
      ...d, tasks: d.tasks.filter(x => x.id !== id),
      // 노션 페이지는 지우지 않고, 다시 가져오지 않도록 기록만 해요.
      pendingDeletes: t && t.notionId ? [...new Set([...d.pendingDeletes, t.notionId])] : d.pendingDeletes,
    }));
    setSelectedId(s => s === id ? null : s);
    toast(t && t.notionId ? '삭제했어요 (노션의 페이지는 그대로 남아 있어요)' : '삭제했어요');
  };
  const applyOrder = ids => update(d => {
    const orders = ids.map(id => (d.tasks.find(t => t.id === id) || { order: 0 }).order).sort((a, b) => a - b);
    const map = new Map(ids.map((id, i) => [id, orders[i]]));
    return { ...d, tasks: d.tasks.map(t => map.has(t.id) ? { ...t, order: map.get(t.id) } : t) };
  });
  const rollOver = mode => {
    const yday = addDays(today, -1);
    const ids = dataRef.current.tasks.filter(t => !t.done && (mode === 'all' ? t.due < today : t.due === yday)).map(t => t.id);
    if (!ids.length) { toast('이월할 항목이 없어요'); return; }
    update(d => ({ ...d, tasks: d.tasks.map(t => ids.includes(t.id) ? { ...t, due: today, notionDirty: true } : t) }));
    toast(`${ids.length}개를 오늘 목록으로 가져왔어요`, 'ok');
  };

  /* ---- 메모 / 뇌 덤프 ---- */
  const addBrain = (tasks, memos) => {
    update(d => {
      let o = nextOrder(d);
      return {
        ...d,
        tasks: [...d.tasks, ...tasks.map(t => ({ ...blankTask(), title: t.title, due: t.due, time: t.time, priority: t.priority, tags: t.tags, order: o++ }))],
        memos: [...memos.map(m => ({ id: uid(), text: m, createdAt: new Date().toISOString() })), ...d.memos],
      };
    });
    toast(`할 일 ${tasks.length}개, 메모 ${memos.length}개를 등록했어요`, 'ok');
  };
  const memoToTask = id => {
    const m = dataRef.current.memos.find(x => x.id === id); if (!m) return;
    update(d => ({ ...d, memos: d.memos.filter(x => x.id !== id), tasks: [...d.tasks, { ...blankTask(), title: m.text, due: today, order: nextOrder(d) }] }));
    toast('할 일로 옮겼어요', 'ok');
  };
  const deleteMemo = id => update(d => ({ ...d, memos: d.memos.filter(x => x.id !== id) }));

  /* ---- AI ---- */
  const needAI = () => { toast('설정에서 Gemini 또는 OpenAI API 키를 입력하면 쓸 수 있어요', 'err'); setModal('settings'); };
  const runBreakdown = async id => {
    const t = dataRef.current.tasks.find(x => x.id === id); if (!t) return;
    if (!aiReady) return needAI();
    setAiBusy(b => ({ ...b, [id]: true }));
    try {
      const j = await callAI(settings, AI_SYS, `큰 할 일을 30분~1시간 단위의 구체적인 하위 작업 4~6개로 쪼개 주세요. 각 항목은 한국어로 행동 중심으로 쓰고, 끝에 예상 소요시간을 (30분) 형식으로 붙이세요.
할 일: ${t.title}
${t.notes ? '메모: ' + t.notes.slice(0, 800) : ''}
JSON 형식: {"subtasks":["..."]}`);
      const arr = (Array.isArray(j.subtasks) ? j.subtasks : []).map(x => String(typeof x === 'string' ? x : (x && (x.title || x.text)) || '').trim()).filter(Boolean).slice(0, 6);
      if (!arr.length) throw new Error('AI가 하위 작업을 만들지 못했어요.');
      update(d => ({ ...d, tasks: d.tasks.map(x => x.id === id ? { ...x, subtasks: [...x.subtasks, ...arr.map(text => ({ id: uid(), text, done: false }))], notionDirty: true, contentDirty: true } : x) }));
      toast(`하위 작업 ${arr.length}개를 만들었어요 ✨`, 'ok');
    } catch (e) { toast('AI 오류: ' + e.message, 'err'); }
    setAiBusy(b => { const n = { ...b }; delete n[id]; return n; });
  };
  const runBriefing = async () => {
    if (!aiReady) return needAI();
    const list = dataRef.current.tasks.filter(t => !t.done && t.due <= addDays(today, 3));
    if (!list.length) { toast('분석할 할 일이 없어요'); return; }
    setAiBusy(b => ({ ...b, briefing: true }));
    try {
      const lines = list.map(t => `- ${t.title} | 마감 ${t.due}${t.time ? ' ' + t.time : ''} | 우선순위 ${PRI[t.priority].label}${t.pinnedDate === today ? ' | 오늘의 핵심' : ''}`).join('\n');
      const j = await callAI(settings, AI_SYS, `오늘은 \${today} (\${DOW[parseYmd(today).getDay()]}요일)입니다. 아래 할 일을 보고 오늘 처리할 우선순위 순서(최대 5개)와 짧은 이유, 그리고 한 줄 응원 메시지를 만들어 주세요.
${lines}
JSON 형식: {"order":[{"title":"(위 목록의 제목 그대로)","reason":"짧은 이유"}],"message":"한 줄 응원"}`);
      const order = (Array.isArray(j.order) ? j.order : []).filter(o => o && o.title).map(o => ({ title: String(o.title), reason: String(o.reason || '') })).slice(0, 5);
      if (!order.length) throw new Error('AI 응답을 해석하지 못했어요.');
      update(d => ({ ...d, briefing: { date: today, order, message: String(j.message || '오늘도 화이팅!') } }));
      toast('AI 브리핑을 업데이트했어요', 'ok');
    } catch (e) { toast('AI 오류: ' + e.message, 'err'); }
    setAiBusy(b => { const n = { ...b }; delete n.briefing; return n; });
  };

  /* ---- 노션 ---- */
  const importFromNotion = async (s, sc) => {
    let pages = [], cursor;
    for (let i = 0; i < 10; i++) {
      const r = await nfetch(s, `/v1/databases/${notionDbId(s)}/query`, 'POST', { page_size: 100, ...(cursor ? { start_cursor: cursor } : {}) });
      pages = pages.concat(r.results || []);
      if (!r.has_more) break; cursor = r.next_cursor;
    }
    const parsed = pages.map(p => parsePage(p, sc)).filter(p => !p.archived);
    let added = 0, updated = 0;
    update(d => {
      const skip = new Set(d.pendingDeletes);
      const remote = new Map(parsed.map(p => [p.notionId, p]));
      const known = new Set(d.tasks.map(t => t.notionId).filter(Boolean));
      let o = nextOrder(d);
      const tasks = d.tasks.map(t => {
        const p = t.notionId && remote.get(t.notionId);
        if (!p || t.notionDirty || p.edited === t.notionEdited) return t;   // 로컬 변경이 있으면 로컬 우선
        updated++;
        return { ...t, title: p.title, due: p.due || t.due, time: p.due ? p.time : t.time, done: p.done, doneAt: p.done ? (t.doneAt || new Date().toISOString()) : null,
          tags: sc.tagsName ? p.tags : t.tags, priority: p.priority || t.priority, notionEdited: p.edited };
      });
      parsed.forEach(p => {
        if (known.has(p.notionId) || skip.has(p.notionId)) return;
        added++;
        tasks.push({ ...blankTask(), title: p.title, due: p.due || today, time: p.time, done: p.done, doneAt: p.done ? new Date().toISOString() : null,
          tags: p.tags, priority: p.priority || 'mid', order: o++, notionId: p.notionId, notionEdited: p.edited, notionDirty: false, contentDirty: false });
      });
      return { ...d, tasks };
    });
    return { added, updated };
  };
  const replaceNoteBlock = async (s, t) => {
    // 앱이 만든 "상세 노트" 토글만 교체하고, 노션에서 직접 쓴 본문은 건드리지 않아요.
    const r = await nfetch(s, `/v1/blocks/${t.notionId}/children?page_size=100`);
    for (const b of (r.results || [])) {
      const txt = b.type === 'toggle' ? ((b.toggle.rich_text || []).map(x => x.plain_text).join('')) : '';
      if (txt === NOTE_MARK) await nfetch(s, `/v1/blocks/${b.id}`, 'DELETE');
    }
    const blocks = wrapNotes(t);
    if (blocks.length) await nfetch(s, `/v1/blocks/${t.notionId}/children`, 'PATCH', { children: blocks });
  };
  const exportToNotion = async (s, sc) => {
    const targets = dataRef.current.tasks.filter(t => (t.notionDirty || !t.notionId) && t.title.trim());
    let ok = 0, fail = 0, lastErr = '';
    for (let i = 0; i < targets.length; i++) {
      const t = targets[i];
      setSyncing(`노션으로 내보내는 중… (${i + 1}/${targets.length})`);
      try {
        const props = taskToProps(t, sc);
        let page;
        if (!t.notionId) page = await nfetch(s, '/v1/pages', 'POST', { parent: { database_id: notionDbId(s) }, properties: props, children: wrapNotes(t) });
        else {
          page = await nfetch(s, `/v1/pages/${t.notionId}`, 'PATCH', { properties: props });
          if (t.contentDirty) await replaceNoteBlock(s, t);
        }
        update(d => ({ ...d, tasks: d.tasks.map(x => x.id === t.id ? { ...x, notionId: page.id, notionEdited: page.last_edited_time, notionDirty: false, contentDirty: false } : x) }));
        ok++;
      } catch (e) { fail++; lastErr = e.message; }
    }
    return { ok, fail, lastErr };
  };
  const runNotion = async mode => {
    if (syncing) return;
    if (!notionConfigured || !settings.proxyUrl) { toast('설정에서 노션 토큰, DB ID, 프록시 URL을 입력해 주세요', 'err'); setModal('settings'); return; }
    const s = settings;
    try {
      setSyncing('노션 연결 확인 중…');
      const sc = await notionSchema(s);
      if (!sc.titleName) throw new Error('데이터베이스에서 제목(Title) 속성을 찾을 수 없어요.');
      const msgs = [];
      if (mode !== 'export') { setSyncing('노션에서 가져오는 중…'); const r = await importFromNotion(s, sc); msgs.push(`가져오기 ${r.added}개 추가 · ${r.updated}개 갱신`); }
      if (mode !== 'import') {
        const r = await exportToNotion(s, sc);
        msgs.push(`내보내기 ${r.ok}개 완료${r.fail ? ` · \${r.fail}개 실패(\${r.lastErr})` : ''}`);
      }
      toast('노션 동기화: ' + msgs.join(' / '), 'ok');
    } catch (e) { toast(e.message, 'err'); }
    setSyncing('');
  };

  /* ---- 설정 / 백업 ---- */
  const saveSettings = s => setSettings(s);
  const toggleTheme = () => setSettings(s => ({ ...s, theme: isDark ? 'light' : 'dark' }));
  const exportBackup = () => {
    const blob = new Blob([JSON.stringify({ app: 'jitmaja', version: 1, exportedAt: new Date().toISOString(), data: dataRef.current }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `jitmaja-backup-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('백업 파일을 내려받았어요', 'ok');
  };
  const importBackup = file => {
    const r = new FileReader();
    r.onload = () => {
      try {
        const j = JSON.parse(r.result), obj = j.data || j;
        if (!obj || !Array.isArray(obj.tasks)) throw new Error('올바른 백업 파일이 아니에요.');
        if (!confirm(`할 일 ${obj.tasks.length}개를 불러오고, 현재 데이터를 덮어쓸까요?`)) return;
        update(() => normalizeData(obj)); setSelectedId(null); toast('백업을 복원했어요', 'ok');
      } catch (e) { toast('복원 실패: ' + e.message, 'err'); }
    };
    r.readAsText(file);
  };
  const resetAll = kind => {
    if (!confirm(kind === 'seed' ? '현재 데이터를 지우고 샘플 데이터로 초기화할까요?' : '모든 할 일과 메모를 삭제할까요? (백업을 먼저 받아 두세요)')) return;
    update(() => kind === 'seed' ? makeSeed() : normalizeData({})); setSelectedId(null); toast('초기화했어요');
  };

  /* ---- ctx ---- */
  const ctx = {
    data, settings, today, view, setView: v => { setSelectedId(null); setViewRaw(v); },
    selectedId, selectedTask: data.tasks.find(t => t.id === selectedId) || null,
    select: id => setSelectedId(id), closeDetail: () => setSelectedId(null),
    addParsed, updateTask, toggleDone, togglePin, deleteTask, applyOrder, rollOver,
    addBrain, memoToTask, deleteMemo, runBreakdown, runBriefing, aiBusy, aiReady, pomo,
    syncing, notionConfigured, runNotion, toast, isDark, toggleTheme, saveSettings,
    exportBackup, importBackup, resetAll,
    openSettings: () => setModal('settings'), openBrain: () => setModal('brain'), openPick: () => setModal('pick'),
  };
  const closeModal = () => setModal(null);
  const toastCls = { ok: 'bg-emerald-600', err: 'bg-rose-600', info: 'bg-slate-800 dark:bg-slate-700' };

  return (
    <div className="min-h-screen">
      <Header ctx={ctx} headerRef={headerRef} />
      <main className="max-w-6xl mx-auto px-3 sm:px-5 pb-20">
        {view === 'home' ? <Home ctx={ctx} /> : <CalendarView ctx={ctx} />}
        <footer className="mt-10 text-center text-[11px] text-slate-400">데이터는 이 브라우저에만 저장돼요 · 설정에서 JSON으로 백업하세요</footer>
      </main>

      {modal === 'settings' && <SettingsModal ctx={ctx} onClose={closeModal} />}
      {modal === 'brain' && <BrainDumpModal ctx={ctx} onClose={closeModal} />}
      {modal === 'pick' && <PickModal ctx={ctx} onClose={closeModal} />}

      <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] flex flex-col items-center gap-2 w-[calc(100%-2rem)] max-w-md pointer-events-none">
        {toasts.map(t => <div key={t.id} className={`pop pointer-events-auto text-white text-sm font-medium rounded-xl px-4 py-2.5 shadow-lg w-full text-center ${toastCls[t.kind] || toastCls.info}`}>{t.msg}</div>)}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
